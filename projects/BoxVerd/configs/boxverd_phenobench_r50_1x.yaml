# BoxVerd on the PhenoBench dataset, R-50 backbone.
#
# BoxVerd reuses the BoxInst/CondInst architecture (this config inlines
# AdelaiDet/configs/BoxInst/Base-BoxInst.yaml so it is self-contained and lives
# entirely under the live-mounted projects/ tree) but selects the BoxVerd
# meta-architecture, which swaps BoxInst's projection+pairwise mask losses for
# PoseSegModel's self-supervised box-only "ridge" losses (obj0 + obj1) and a
# shuffler consistency augmentation. See projects/BoxVerd/boxverd/.
#
# MODEL.BOXINST.ENABLED stays True: BoxVerd reuses CondInst's box->bitmask data
# path (the color-similarity it also computes is simply unused). Solver schedule
# and dataset paths match boxteacher_phenobench_r50_1x.yaml for comparison.
MODEL:
  META_ARCHITECTURE: "BoxVerd"
  MASK_ON: True
  # Reuse the R-50.pkl already downloaded into pretrained_models/ for BoxTeacher
  # (see README). Relative to the working dir (repo root).
  WEIGHTS: "pretrained_models/R-50.pkl"
  BACKBONE:
    NAME: "build_fcos_resnet_fpn_backbone"
  RESNETS:
    DEPTH: 50
    OUT_FEATURES: ["res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res3", "res4", "res5"]
  PROPOSAL_GENERATOR:
    NAME: "FCOS"
  FCOS:
    THRESH_WITH_CTR: True
    USE_SCALE: True
    NUM_CLASSES: 2          # crop, weed (default is 80 for COCO)
  CONDINST:
    TOPK_PROPOSALS_PER_IM: 64
    MASK_BRANCH:
      OUT_CHANNELS: 16
  BOXINST:
    ENABLED: True
    BOTTOM_PIXELS_REMOVED: 10
    PAIRWISE:
      SIZE: 3
      DILATION: 2
      COLOR_THRESH: 0.3
  BOX_VERD:
    SHUFFLE_NUM: 4          # slice-and-roll ops per direction; 0 disables shuffling
    WARMUP_ITERS: 3000      # ramp the self-supervised seg losses (scaled like BoxInst pairwise)
    RIDGE_THRESH: 0.95
    INFLATE_WEIGHT: 0.1
    SEG_WEIGHT: 1.0
    INFER_CHANNEL: "obj1"   # emit obj1 (distilled) as the predicted mask at inference
DATASETS:
  TRAIN: ("phenobench_train",)
  TEST: ("phenobench_val",)
SOLVER:
  # 1407 train imgs / IMS_PER_BATCH 16 ~= 88 iters/epoch. 20000 iters ~= 227
  # epochs. Matches the BoxTeacher PhenoBench schedule for a fair comparison.
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 20000
  STEPS: (14000, 18000)
TEST:
  EVAL_PERIOD: 2000
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
OUTPUT_DIR: "output/boxverd_phenobench_r50_1x"
